- author: Seth Brown
  quote: The Bike Project has allowed me to maintain a fleet of bikes for a family of 5 and affordably upgrade my daughter’s bikes as they outgrow them annually. But the real fun has been learning the practical, mechanical skills of bike maintenance along the way. In a country that’s moving toward machines with “no user-serviceable parts inside” and treats consumer goods as disposable, the bike project is a welcome harbor for those who like to tinker and see value in used things.
- author: Jason White
  quote: I am really stoked to see the evolution of the bike project. It has benefitted so many families already. I like that the entire project is truly heart-driven and grassroots. The volunteerism and little budget keep it authentic and nimble. Personally, I have gained priceless cruiser bike opinions and fixes. My steed is riding better than ever!
- author: Adam Carballeira
  quote: In its early days, known as the Bonedale Bike Project, Aaron worked out of a shed behind main street, and was often even a mobile operation. Over the years, he has helped so many people refurbish a bicycle to ride around town. Not only do these people leave with a smile and a healthful bicycle, but also a sense of pride and accomplishment of having made something themselves. Especially for kids, this “making” is increasingly rare and satisfying. I work with youth too, and over the years have referred dozens of kids to Aaron and the Bike Project to build a bike. Many of these kids don’t have much support from home, or success in academics. The Way of Compassion Bike project has provided them a place where they can feel safe, valuable, and successful. It is an invaluable community resource.
- author: Danny Stone
  quote: As a third grade teacher at Crystal River Elementary, the Bike Project has been amazing for my school. Every year we take our students on a bike tour campout to a local ranch. Every year, Aaron donates his time to come to school and teach our students about how bikes work, bicycle safety, and the importance and value of riding bikes. Additionally, the Bicycle Project does minor and major bicycle maintenance to make sure all the students’ bikes are in working order for our trip. This year, the Bicycle Project is even helping to make sure every student in third grade has their own bicycle. Teachers sent the project the number of students who don’t have bicycles along with their heights and the Bicycle Project will make sure they have their own bicycle in time to pedal to the ranch. The Bicycle Project’s support of our school has been invaluable and incredible.
- author: Miles Spiess
  quote: Thank you so much for helping me with my capstone. The learning and assistance has been extremely beneficial and I am very grateful. Also, thanks for the parts that allowed me to build my bike. Without this resource I most likely would have been unsuccessful with this project, so thank you.
- author: Ian
  quote: Thank you so much for the bike, because now I get to school faster!
- author: Megan, Beth, Brendan, and Paige, Andy Zanca Youth Empowerment Program
  quote: Thank you so much for donating to our 24 Hour Takeover Silent Auction! The bike is absolutely beautiful and we’re so grateful! Your support means so much to our staff and the 1,000+ kids we broadcast each year.
- author: Lauren
  quote: I dropped off my old bike and tried on the bike the guys said would be for me! The guys were great. They were really nice and knowledgeable, even the 13-year-old. You don’t see that very often. He was awesome. He walked to my car with me, got my bike, and walked it in. So polite! I just really appreciate you all and what you are doing for our community.
- author: Andrea
  quote: Thank you for co-hosting our March Business After Hours event! We sure appreciate your continued support!
